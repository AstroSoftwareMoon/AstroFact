# Despliegue mínimo autohospedado. Los datos viven en el volumen "astrofact-datos" de TU servidor.
services:
  astrofact:
    image: ghcr.io/astrosoftwaremoon/astrofact-server:latest
    restart: unless-stopped
    ports: ["8080:8080"]
    volumes: ["astrofact-datos:/data"]
volumes:
  astrofact-datos:
