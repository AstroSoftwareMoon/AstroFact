[package]
name = "astrofact"
version = "0.2.0"
description = "AstroFact — facturación libre para autónomos y pymes (VERI*FACTU y No VERI*FACTU)"
authors = ["AstroFact contributors"]
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.77"

[lib]
name = "astrofact_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
