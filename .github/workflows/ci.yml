name: CI
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  fiscal-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: xmllint (validación contra los XSD oficiales de la AEAT)
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm -r build
      - name: Los XSD oficiales siguen siendo válidos
        run: |
          cd docs/normativa
          xmllint --noout --schema xsd/SuministroInformacion.xsd ejemplos/ejemploRegistro-firmado-epes-xades4j.xml
