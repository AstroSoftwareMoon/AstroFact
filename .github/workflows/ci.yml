name: CI
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    name: Tests (fiscal-core, db) y validación XSD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: xmllint (XSD de la AEAT) y poppler (escaneo del QR en los PDF)
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils poppler-utils
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm --filter @astrofact/fiscal-core --filter @astrofact/db --filter @astrofact/pdf --filter @astrofact/server test
      - run: pnpm --filter @astrofact/client build:web
      - run: pnpm --filter @astrofact/fiscal-core build
      - name: Los ejemplos oficiales siguen validando
        run: cd docs/normativa && xmllint --noout --schema xsd/SuministroInformacion.xsd ejemplos/ejemploRegistro-firmado-epes-xades4j.xml

  e2e:
    name: E2E emisión (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pnpm --filter @astrofact/client exec playwright install --with-deps chromium
      - run: pnpm --filter @astrofact/client e2e

  tauri-check:
    name: Tauri (cargo check, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/client/src-tauri }
      - name: cargo check
        run: |
          mkdir -p apps/client/dist && echo '<!doctype html>' > apps/client/dist/index.html
          cd apps/client/src-tauri && cargo check --locked || cargo check

  docker:
    name: Imagen Docker (build sin publicar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., file: apps/server/Dockerfile, push: false, load: true, tags: "astrofact-server:ci" }
      - name: Arranca y responde
        run: |
          docker run -d --name af -p 8080:8080 astrofact-server:ci
          for i in $(seq 1 20); do curl -sf localhost:8080/api/salud && exit 0; sleep 1; done; docker logs af; exit 1
